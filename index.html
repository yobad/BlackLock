<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BlackLock Phone Lock</title>

<style>
body {
    background: black;
    color: #00ffcc;
    font-family: monospace;
    text-align: center;
    margin-top: 60px;
}

#clock {
    font-size: 70px;
}

button {
    padding: 12px 20px;
    margin: 10px;
    font-size: 16px;
}

input {
    padding: 8px;
    font-size: 18px;
}

#status {
    margin-top: 20px;
    font-size: 18px;
}

#savedSchedule {
    margin-top: 10px;
    font-size: 16px;
}
</style>

</head>

<body>

<h1>BlackLock</h1>

<div id="clock">00:00:00 AM</div>

<br><br>

<h3>Set Start Time</h3>
<input type="time" id="startTime" name="start_time" value="{{START_TIME}}">

<h3>Lock Duration (minutes)</h3>
<input type="number" id="duration" name="duration" min="1" value="{{DURATION}}">

<br><br>

<button onclick="saveSchedule()">Save Schedule</button>
<button onclick="sendLockCommand('LOCK')">Phone Placed In Box</button>
<button onclick="sendLockCommand('EMERGENCY_UNLOCK')">Emergency Unlock</button>

<p id="status">{{MESSAGE}}</p>
<p id="savedSchedule">{{SCHEDULE_INFO}}</p>

<script>
function updateClock() {
    const now = new Date();
    let hours = now.getHours();
    let minutes = String(now.getMinutes()).padStart(2, '0');
    let seconds = String(now.getSeconds()).padStart(2, '0');
    let period = hours >= 12 ? 'PM' : 'AM';
    hours = hours % 12;
    if (hours === 0) hours = 12;
    hours = String(hours).padStart(2, '0');
    document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds} ${period}`;
}

setInterval(updateClock, 1000);

function saveSchedule() {
    const startTime = document.getElementById('startTime').value;
    const duration = document.getElementById('duration').value;
    if (!startTime || !duration) {
        document.getElementById('status').textContent = 'Please set both start time and duration.';
        return;
    }

    fetch(`/set?start_time=${encodeURIComponent(startTime)}&duration=${encodeURIComponent(duration)}`)
        .then(response => response.text())
        .then(html => {
            document.open();
            document.write(html);
            document.close();
        })
        .catch(error => {
            document.getElementById('status').textContent = 'Failed to send schedule.';
            console.log(error);
        });
}

function sendLockCommand(cmd) {
    fetch(`/command?cmd=${encodeURIComponent(cmd)}`)
        .then(response => response.text())
        .then(html => {
            document.open();
            document.write(html);
            document.close();
        })
        .catch(error => {
            document.getElementById('status').textContent = 'Failed to send command.';
            console.log(error);
        });
}
</script>

</body>
</html>
